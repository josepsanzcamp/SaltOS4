# SaltOS recipe for nginx with php-fpm
#
# Copy this file to /etc/nginx/sites-available/saltos4, adapt the lines marked
# with CHANGE, enable the site and validate it with the follow command:
#
# php api/index.php setup/server http://localhost/api
#
# Only the web directory must be published, the rest of the code (api, apps
# and data) lives outside of the document root and it is not accessible

server {
    listen 80; # CHANGE: the port
    server_name localhost; # CHANGE: the name of your site
    root /path/to/saltos4/code/web; # CHANGE: the path of your web directory
    index index.html index.php;

    # Does not show the nginx version
    server_tokens off;

    # Maximum size of the requests, must match with the upload_max_filesize
    # and post_max_size of the php.ini
    client_max_body_size 50M; # CHANGE: the maximum size

    # Compress the static contents, the html is compressed by default
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content types that nginx does not know
    include mime.types;
    types {
        application/javascript mjs;
        application/json map;
    }

    # PHP support, the Authorization header is passed by default
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock; # CHANGE: the php-fpm socket

        # Maximum time of the requests, must match with the max_execution_time
        # of the php.ini
        fastcgi_read_timeout 300s; # CHANGE: the maximum time
    }
}
