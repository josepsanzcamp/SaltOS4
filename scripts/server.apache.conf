# SaltOS recipe for apache
#
# Copy this file to /etc/apache2/sites-available/saltos4.conf, adapt the lines
# below the CHANGE marks, enable the site and validate it with the follow command:
#
# php api/index.php setup/server http://localhost/api
#
# Only the web directory must be published, the rest of the code (api, apps
# and data) lives outside of the document root and it is not accessible
#
# To hide the apache version, set ServerTokens Prod and ServerSignature Off
# in the global configuration (/etc/apache2/conf-available/security.conf)

# CHANGE: the port, the name of your site and the path of your web directory
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /path/to/saltos4/code/web

    # CHANGE: the path of your web directory
    <Directory /path/to/saltos4/code/web>
        # Does not show the contents of the directories and does not use .htaccess files
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php

        # Content types for the servers that do not know it
        AddType text/html .htm .html
        AddType application/javascript .js .mjs
        AddType text/css .css
        AddType application/json .map
        AddType image/svg+xml .svg
        AddType image/png .png
        AddType image/jpeg .jpg .jpeg
        AddType application/pdf .pdf

        # Pass the Authorization header to php
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
        CGIPassAuth On
    </Directory>
</VirtualHost>
