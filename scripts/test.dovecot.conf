# Dovecot configuration for the test profile of docker-compose.yaml, loaded after the
# default configuration of the official image: any user with the password of the
# USER_PASSWORD variable, IMAP and POP3 over the same mailboxes, special use folders,
# STARTTLS and implicit TLS with the self-signed certificate of the image

# Docker has no IPv6 here, listen only on IPv4
listen = *

# IMAP and POP3 only, the other services of the image are not needed
protocols = imap pop3
