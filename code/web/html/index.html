<html lang="en" data-bs-theme="">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>SaltOS v4.1</title>
        <link rel="icon" type="image/svg+xml" href="img/logo_red.svg">
        <meta name="color-scheme" content="dark light">
        <script>
            (() => {
                const is_dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.bsTheme = is_dark ? 'dark' : '';
            })();
        </script>
        <link href="lib/bootstrap/bootstrap.min.css" rel="stylesheet" integrity="">
        <link href="lib/index.css" rel="stylesheet" integrity="">
    </head>
    <body>
        <noscript>
            <strong>We're sorry but SaltOS doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </noscript>
        <script src="lib/index.js" integrity=""></script>
        <script src="index.js" integrity=""></script>
    </body>
</html>
