app: company
require: apps/common/php/default.php
template: apps/common/xml/default.xml
indent: true
screen: type2modal
col_class: col-md-6
dropdown: false
list:
    # [id, type, label]
    - [name, text, Name]
    - [code, text, CIF]
    - [city, text, City]
    - [country, text, Country]
    - [active, boolean, Active]
form:
    # [id, type, label]
    - [active, switch, Active]
    - newline
    - [name, text, Name]
    - [code, text, Code]
    - newline
    - [address, text, Address]
    - [city, text, City]
    - [province, text, Province / State]
    - [zip, text, ZIP]
    - [country, text, Country]
    - newline
    - [phone, text, Phone]
    - [email, text, Email]
    - [website, text, Website]
    - [iban, text, IBAN]
    - [swift, text, SWIFT/BIC]
    - [fiscal_regime, text, Fiscal Regime]
    - [activity_code, text, Activity Code]
    - [tax_mode, options, Tax mode]
    - [withholding_mode, options, Withholding mode]
    - [notes, textarea, Additional Notes]
options:
    # field:
    #     - [value, label]
    tax_mode:
        - [0, Not used]
        - [1, One by document]
        - [2, By line]
    withholding_mode:
        - [0, Not used]
        - [1, One by document]
        - [2, By line]
attr:
    # field:
    #     attr: value
    name:
        required: true
        autofocus: true
    notes:
        col_class: col-md-12
        height: 5em
    city:
        col_class: col-md-3
    province:
        col_class: col-md-3
    zip:
        col_class: col-md-3
    country:
        col_class: col-md-3
    code:
        col_class: col-md-3
    email:
        col_class: col-md-4
    phone:
        col_class: col-md-4
    website:
        col_class: col-md-4
    iban:
        col_class: col-md-4
    swift:
        col_class: col-md-3
    fiscal_regime:
        col_class: col-md-3
    activity_code:
        col_class: col-md-2
    tax_mode:
        value: 2
        col_class: col-md-3
    withholding_mode:
        value: 0
        col_class: col-md-3
