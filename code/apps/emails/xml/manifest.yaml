apps:
    - id: 13
      active: 1
      code: emails
      name: Emails
      description: Emails app client
      table: app_emails
      field: CONCAT(IF(is_outbox, `to`, `from`),' - ',subject)
      subtables: app_emails_address(email_id)
      has_index: 1
      has_control: 1
      has_files: 1
      perms: main,menu,create,widget,action,config,help,list*,view*,delete*
      group: core
      position: 1
      color: primary
      layout: "3,3,1,1"

    - id: 15
      active: 1
      code: emails_accounts
      name: Emails accounts
      description: Emails accounts app
      table: app_emails_accounts
      field: CONCAT(email_name,' <',email_from,'>')
      has_index: 1
      has_control: 1
      has_version: 1
      has_files: 1
      has_notes: 1
      has_log: 1
      perms: main,create,action,config,help,info,list*,view*,edit*,delete*

widgets:
    - active: 1
      code: last_n_emails
      name: Last emails
      description: Shows the latest received or sent emails
      app: emails
      layout: "0,4,4,8"
