app: cronlog
require: apps/common/php/default.php
template: apps/common/xml/default.xml
indent: true
screen: type2
col_class: col-md-4 mb-3
dropdown: false
list:
    # [id, type, label]
    - [cmd, text, Command]
    - [start, text, Start]
    - [out, hastext, Out]
    - [err, hastext, Err]
form:
    # [id, type, label]
    - [cmd, codemirror, Command]
    - [pid, text, PID]
    - [start, datetime, Start]
    - [stop, datetime, Stop]
    - [out, codemirror, STDOUT]
    - [err, codemirror, STDERR]
attr:
    # field:
    #     attr: value
    cmd:
        col_class: col-md-12 mb-3
        height: 5em
    out:
        mode: json
        indent: true
        col_class: col-md-12 mb-3
        height: 5em
    err:
        mode: json
        indent: true
        col_class: col-md-12 mb-3
        height: 5em
