app: configlog
require: apps/common/php/default.php
template: apps/common/xml/default.xml
indent: true
screen: type2
col_class: col-md-6
dropdown: false
list:
    # [id, type, label]
    - [user_id, select, User]
    - [key, text, Key]
form:
    # [id, type, label]
    - [user_id, select, User]
    - [key, text, Key]
    - [val, codemirror, Value]
select:
    # [id, table, optional field]
    - [user_id, tbl_users]
attr:
    # field:
    #     attr: value
    key:
        required: true
        autofocus: true
    val:
        required: true
        mode: json
        indent: true
        col_class: col-md-12
        height: 5em
